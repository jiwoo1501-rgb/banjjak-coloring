<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFF0F6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="반짝 색칠">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>반짝 색칠놀이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
  :root {
    color-scheme: light;
    --ground: #FFF0F6;
    --dot: #FFD9E8;
    --ink: #3A2447;
    --ink-soft: #7A6385;
    --card: #FFFFFF;
    --pink: #FF5C9A;
    --pink-d: #D63A7A;
    --sun: #FFC83D;
    --sun-d: #D99A0B;
    --mint: #37C9AD;
    --mint-d: #1E9E86;
    --sky: #6FB8FF;
    --sky-d: #3E8AD6;
    --lilac: #EFE3FF;
    --font: "Jua", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px);
  }
  [hidden] { display: none !important; }
  html { box-sizing: border-box; height: 100%; }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    height: 100%; margin: 0; background: var(--ground); color: var(--ink);
    background-image: radial-gradient(var(--dot) 2.2px, transparent 2.6px);
    background-size: 26px 26px;
    font-family: var(--font); font-size: 18px;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
  button:focus-visible { outline: 4px solid var(--sky); outline-offset: 3px; }
  #app { height: 100%; }
  .screen { height: 100%; }

  /* 공통 사탕 버튼 */
  .candy {
    --c: var(--pink); --cd: var(--pink-d);
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-width: 52px; height: 52px; padding-inline: 12px; border-radius: 18px;
    background: var(--c); color: #fff; font-size: 19px;
    box-shadow: 0 5px 0 var(--cd); transition: transform .08s, box-shadow .08s;
  }
  .candy:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--cd); }
  .candy svg { width: 28px; height: 28px; flex: none; }
  .candy.sun { --c: var(--sun); --cd: var(--sun-d); color: var(--ink); }
  .candy.mint { --c: var(--mint); --cd: var(--mint-d); }
  .candy.sky { --c: var(--sky); --cd: var(--sky-d); }
  .candy.plain { --c: #fff; --cd: #E6D2E0; color: var(--ink); }

  /* ───── 홈 ───── */
  #home { overflow-y: auto; padding: 14px 16px 28px; -webkit-overflow-scrolling: touch; }
  .home-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; max-width: 1100px; margin: 0 auto 14px; }
  .logo { flex: 1 1 auto; margin: 0; font-weight: 400; font-size: clamp(34px, 9vw, 54px); line-height: 1.05; letter-spacing: -.02em; }
  .logo span { display: inline-block; -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); }
  .logo span:nth-child(1) { color: #FF5C9A; transform: rotate(-6deg); }
  .logo span:nth-child(2) { color: #FFC83D; transform: rotate(4deg) translateY(-3px); }
  .logo span:nth-child(3) { width: .3em; }
  .logo span:nth-child(4) { color: #37C9AD; transform: rotate(-3deg); }
  .logo span:nth-child(5) { color: #6FB8FF; transform: rotate(5deg) translateY(2px); }
  .logo span:nth-child(6) { color: #A77BFF; transform: rotate(-4deg); }
  .logo span:nth-child(7) { color: #FF8A4C; transform: rotate(3deg) translateY(-2px); }
  .head-btns { display: flex; gap: 10px; align-items: center; }
  .stars-pill { display: inline-flex; align-items: center; gap: 6px; height: 52px; padding-inline: 14px; border-radius: 18px; background: #fff; box-shadow: 0 5px 0 #E6D2E0; font-size: 24px; font-variant-numeric: tabular-nums; }
  .stars-pill svg { width: 30px; height: 30px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; max-width: 1100px; margin: 0 auto; }
  .card {
    position: relative; display: flex; flex-direction: column; gap: 6px; padding: 8px 8px 10px;
    background: var(--card); border-radius: 22px; box-shadow: 0 6px 0 #EBCFDF; text-align: center;
    transition: transform .12s;
  }
  .card:active { transform: scale(.96); }
  .card svg { width: 100%; height: auto; aspect-ratio: 400 / 480; border-radius: 14px; display: block; }
  .card .nm { font-size: 18px; line-height: 1.2; }
  .card .badge { position: absolute; top: -8px; right: -6px; width: 42px; height: 42px; filter: drop-shadow(0 3px 0 rgba(58,36,71,.25)); }

  /* ───── 색칠 화면 ───── */
  #color {
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto; gap: 10px;
    padding: 10px 16px 12px; overflow: hidden;
  }
  .bar { display: flex; align-items: center; gap: 8px; }
  .bar .sp { flex: 1; }
  .bar .ttl { font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .stage { position: relative; min-height: 0; display: flex; align-items: center; justify-content: center; }
  #art {
    display: block; width: 300px; height: 360px; max-width: 100%;
    background: #fff; border-radius: 22px;
    box-shadow: 0 0 0 5px #fff, 0 8px 0 5px #EBCFDF; touch-action: none;
  }
  .tools { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .tool {
    display: inline-flex; align-items: center; gap: 6px; height: 50px; padding-inline: 14px 16px;
    border-radius: 16px; background: #fff; box-shadow: 0 4px 0 #E6D2E0; font-size: 18px;
  }
  .tool svg { width: 30px; height: 30px; }
  .tool[aria-pressed="true"] { background: var(--ink); color: #fff; box-shadow: 0 4px 0 #1f1227; }
  .sizes { display: inline-flex; gap: 6px; padding: 4px 6px; border-radius: 16px; background: #fff; box-shadow: 0 4px 0 #E6D2E0; }
  .sizes[hidden] { display: none !important; }
  .size { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; }
  .size i { display: block; border-radius: 50%; background: var(--ink); }
  .size[aria-pressed="true"] { background: var(--lilac); outline: 3px solid var(--ink); }
  .palette { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; max-width: 560px; width: 100%; margin: 0 auto; }
  .sw {
    width: 100%; max-width: 50px; height: auto; aspect-ratio: 1; justify-self: center; align-self: center; padding: 0; border-radius: 50%;
    box-shadow: inset 0 0 0 3px rgba(58,36,71,.18), 0 3px 0 rgba(58,36,71,.18);
    transition: transform .1s;
  }
  .sw svg { width: 100%; height: 100%; display: block; border-radius: 50%; }
  .sw[aria-pressed="true"] { transform: scale(1.14); box-shadow: 0 0 0 4px #fff, 0 0 0 7px var(--ink); }

  @media (orientation: landscape) and (min-width: 700px) {
    #color { grid-template-columns: minmax(0, 1fr) 360px; grid-template-rows: auto minmax(0, 1fr) auto; }
    #color .bar { grid-column: 1 / -1; }
    #color .stage { grid-row: 2 / 4; }
    #color .tools { grid-column: 2; align-self: end; }
    #color .palette { grid-column: 2; align-self: start; grid-template-columns: repeat(6, 1fr); }
  }

  /* ───── 내 그림 ───── */
  #gallery { overflow-y: auto; padding: 12px 16px 28px; }
  #gallery .bar { max-width: 1100px; margin: 0 auto 14px; }
  #gallery h2 { margin: 0; font-weight: 400; font-size: 30px; }
  .ggrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; max-width: 1100px; margin: 0 auto; }
  .gitem { padding: 6px; background: #fff; border-radius: 18px; box-shadow: 0 5px 0 #EBCFDF; }
  .gitem img { display: block; width: 100%; border-radius: 12px; aspect-ratio: 400 / 480; object-fit: cover; }
  .empty { max-width: 420px; margin: 40px auto; text-align: center; font-size: 22px; color: var(--ink-soft); line-height: 1.5; }

  /* ───── 팝업 ───── */
  .modal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: rgba(58,36,71,.45); }
  .sheet {
    width: min(440px, 100%); max-height: 100%; overflow-y: auto; padding: 20px 18px 22px; border-radius: 28px;
    background: #fff; text-align: center; box-shadow: 0 10px 0 #EBCFDF; animation: pop .35s cubic-bezier(.3,1.6,.5,1);
  }
  .sheet h3 { margin: 0 0 12px; font-weight: 400; font-size: 30px; }
  .sheet img { display: block; width: min(300px, 100%); margin: 0 auto 8px; border-radius: 18px; box-shadow: 0 0 0 4px var(--lilac); -webkit-touch-callout: default; -webkit-user-select: auto; user-select: auto; }
  .sheet .hint { margin: 0 0 14px; font-size: 15px; color: var(--ink-soft); }
  .sheet .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .sheet .big-star { width: 88px; height: 88px; margin: -6px auto 4px; display: block; animation: spin 1.2s ease-out; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes spin { from { transform: rotate(-200deg) scale(.2); } to { transform: rotate(0) scale(1); } }

  .fx { position: fixed; z-index: 15; pointer-events: none; width: 0; height: 0; }
  .fx i { position: absolute; left: -7px; top: -7px; width: 14px; height: 14px; background: var(--c);
    clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
    animation: burst .55s ease-out forwards; }
  @keyframes burst { from { transform: translate(0,0) scale(.4); opacity: 1; } to { transform: translate(var(--x), var(--y)) scale(1.2) rotate(90deg); opacity: 0; } }
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 30; pointer-events: none; }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 40; transform: translateX(-50%);
    padding: 12px 20px; border-radius: 18px; background: var(--ink); color: #fff; font-size: 17px; max-width: calc(100% - 32px); text-align: center; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition: none !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="pdefs"></defs></svg>

<div id="app">
  <section id="home" class="screen">
    <div class="home-head">
      <h1 class="logo" aria-label="반짝 색칠놀이"><span>반</span><span>짝</span><span> </span><span>색</span><span>칠</span><span>놀</span><span>이</span></h1>
      <div class="head-btns">
        <div class="stars-pill" aria-label="모은 별"><svg viewBox="0 0 40 40"><path d="M20,3 L25,14 L37,15 L28,23 L31,35 L20,29 L9,35 L12,23 L3,15 L15,14Z" fill="#FFC83D" stroke="#3A2447" stroke-width="3" stroke-linejoin="round"/></svg><b id="starCount">0</b></div>
        <button class="candy sky" id="toGallery" aria-label="내 그림 보기"><svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><rect x="4" y="6" width="24" height="20" rx="4"/><circle cx="12" cy="13" r="3"/><path d="M5,24 L13,18 L18,22 L22,18 L28,23"/></svg>내 그림</button>
        <button class="candy plain" id="soundBtn" aria-label="소리 켜고 끄기"></button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="color" class="screen" hidden>
    <div class="bar">
      <button class="candy plain" id="backHome" aria-label="처음으로"><svg viewBox="0 0 32 32" fill="none" stroke="#3A2447" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"><path d="M5,15 L16,5 L27,15"/><path d="M8,13 L8,27 L24,27 L24,13"/><path d="M13,27 L13,19 L19,19 L19,27"/></svg></button>
      <button class="candy plain" id="undoBtn" aria-label="되돌리기"><svg viewBox="0 0 32 32" fill="none" stroke="#3A2447" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"><path d="M10,6 L4,12 L10,18"/><path d="M4,12 L19,12 Q28,12 28,20 Q28,27 19,27 L12,27"/></svg></button>
      <button class="candy plain" id="clearBtn" aria-label="모두 지우기"><svg viewBox="0 0 32 32" fill="none" stroke="#3A2447" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M6,9 L26,9 M12,9 L12,5 L20,5 L20,9 M8,9 L10,28 L22,28 L24,9 M13.5,14 L14,23 M18.5,14 L18,23"/></svg></button>
      <span class="sp"></span>
      <button class="candy sun" id="doneBtn"><svg viewBox="0 0 40 40"><path d="M20,3 L25,14 L37,15 L28,23 L31,35 L20,29 L9,35 L12,23 L3,15 L15,14Z" fill="#fff" stroke="#3A2447" stroke-width="3" stroke-linejoin="round"/></svg>다 했어요</button>
    </div>
    <div class="stage" id="stage">
      <svg id="art" viewBox="0 0 400 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="색칠 그림">
        <g id="artG"></g>
        <g id="paintG" style="mix-blend-mode:multiply" pointer-events="none"></g>
      </svg>
    </div>
    <div class="tools">
      <button class="tool" data-tool="fill" aria-pressed="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"><path d="M14,4 L26,16 L16,26 L4,14Z"/><path d="M4,14 L26,16"/><path d="M27,21 Q30,25 27,28 Q24,25 27,21Z" fill="currentColor"/></svg>콕</button>
      <button class="tool" data-tool="brush" aria-pressed="false"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"><path d="M27,4 L14,18"/><path d="M13,17 Q7,17 7,23 Q7,27 4,28 Q14,30 16,23 Q17,20 15,19Z" fill="currentColor"/></svg>붓</button>
      <button class="tool" data-tool="eraser" aria-pressed="false"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"><path d="M18,5 L28,15 L16,27 L9,27 L4,22Z"/><path d="M11,12 L21,22"/><path d="M16,27 L28,27"/></svg>지우개</button>
      <div class="sizes" id="sizes" hidden>
        <button class="size" data-size="8" aria-label="가는 붓"><i style="width:8px;height:8px"></i></button>
        <button class="size" data-size="18" aria-pressed="true" aria-label="보통 붓"><i style="width:15px;height:15px"></i></button>
        <button class="size" data-size="34" aria-label="굵은 붓"><i style="width:24px;height:24px"></i></button>
      </div>
    </div>
    <div class="palette" id="palette"></div>
  </section>

  <section id="gallery" class="screen" hidden>
    <div class="bar">
      <button class="candy plain" id="galBack" aria-label="처음으로"><svg viewBox="0 0 32 32" fill="none" stroke="#3A2447" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"><path d="M5,15 L16,5 L27,15"/><path d="M8,13 L8,27 L24,27 L24,13"/><path d="M13,27 L13,19 L19,19 L19,27"/></svg></button>
      <h2>내 그림</h2>
    </div>
    <div class="ggrid" id="ggrid"></div>
  </section>
</div>

<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
<canvas id="confetti" hidden></canvas>

<script>
// ───────── 색칠 그림 도안 (viewBox 0 0 400 480) ─────────
// 기본 도형 = 칠할 수 있는 칸 / class="n" 선만 / "k" 까만 눈동자 / "w" 하얀 반짝임
const F = n => +(+n).toFixed(1);

function capsule(x1, y1, x2, y2, w) {
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy);
  const a = Math.atan2(dy, dx) * 180 / Math.PI, mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
  return `<rect x="${F(mx - L / 2)}" y="${F(my - w / 2)}" width="${F(L)}" height="${w}" rx="${w / 2}" transform="rotate(${F(a)} ${F(mx)} ${F(my)})"/>`;
}
function star(cx, cy, R, r, rot = -90) {
  let d = '';
  for (let i = 0; i < 10; i++) {
    const rr = i % 2 ? r : R, a = (rot + i * 36) * Math.PI / 180;
    d += (i ? 'L' : 'M') + F(cx + rr * Math.cos(a)) + ',' + F(cy + rr * Math.sin(a));
  }
  return `<path d="${d}Z"/>`;
}
function heart(cx, cy, s) {
  return `<path d="M${cx},${F(cy + .9 * s)} C${F(cx - 1.3 * s)},${F(cy + .1 * s)} ${F(cx - .9 * s)},${F(cy - .95 * s)} ${cx},${F(cy - .35 * s)} C${F(cx + .9 * s)},${F(cy - .95 * s)} ${F(cx + 1.3 * s)},${F(cy + .1 * s)} ${cx},${F(cy + .9 * s)}Z"/>`;
}
function cloud(cx, cy, s = 1) {
  const q = v => F(v * s);
  return `<path d="M${F(cx - 50 * s)},${F(cy + 15 * s)} a${q(20)},${q(20)} 0 0 1 ${q(10)},${q(-32)} a${q(26)},${q(26)} 0 0 1 ${q(44)},${q(-12)} a${q(22)},${q(22)} 0 0 1 ${q(38)},${q(10)} a${q(18)},${q(18)} 0 0 1 ${q(8)},${q(34)}Z"/>`;
}
function blossom(cx, cy, r) {
  let h = '';
  for (let i = 0; i < 5; i++) {
    const a = (-90 + i * 72) * Math.PI / 180;
    h += `<circle cx="${F(cx + r * Math.cos(a))}" cy="${F(cy + r * Math.sin(a))}" r="${F(r * .78)}"/>`;
  }
  return h + `<circle cx="${cx}" cy="${cy}" r="${F(r * .6)}"/>`;
}
function flower(cx, cy, r, stem) {
  return `<path class="n" d="M${cx},${cy} L${cx},${cy + stem}"/>` +
    `<ellipse cx="${cx + 9}" cy="${F(cy + stem * .62)}" rx="10" ry="5" transform="rotate(-30 ${cx + 9} ${F(cy + stem * .62)})"/>` +
    blossom(cx, cy, r);
}
function butterfly(cx, cy, s = 1) {
  const e = (x, y, rx, ry, rot) => `<ellipse cx="${F(cx + x * s)}" cy="${F(cy + y * s)}" rx="${F(rx * s)}" ry="${F(ry * s)}" transform="rotate(${rot} ${F(cx + x * s)} ${F(cy + y * s)})"/>`;
  return e(-17, -10, 17, 13, -25) + e(17, -10, 17, 13, 25) + e(-12, 12, 11, 9, 25) + e(12, 12, 11, 9, -25) +
    `<ellipse cx="${cx}" cy="${cy}" rx="${F(4.5 * s)}" ry="${F(19 * s)}"/>` +
    `<path class="n" d="M${F(cx - 2 * s)},${F(cy - 17 * s)} Q${F(cx - 8 * s)},${F(cy - 30 * s)} ${F(cx - 14 * s)},${F(cy - 32 * s)} M${F(cx + 2 * s)},${F(cy - 17 * s)} Q${F(cx + 8 * s)},${F(cy - 30 * s)} ${F(cx + 14 * s)},${F(cy - 32 * s)}"/>`;
}
function note(x, y) {
  return `<ellipse cx="${x}" cy="${y}" rx="11" ry="8" transform="rotate(-20 ${x} ${y})"/>` +
    `<path class="n" d="M${x + 10},${y - 3} L${x + 10},${y - 38} Q${x + 20},${y - 30} ${x + 26},${y - 20}"/>`;
}
function bangs(cx, cy, s) {
  const r = 66 * s, p = v => F(v);
  return `<path d="M${p(cx - r - 4 * s)},${p(cy + 10 * s)} C${p(cx - r - 8 * s)},${p(cy - r)} ${p(cx - 20 * s)},${p(cy - r - 14 * s)} ${cx},${p(cy - r - 10 * s)} ` +
    `C${p(cx + 30 * s)},${p(cy - r - 14 * s)} ${p(cx + r + 8 * s)},${p(cy - r + 10 * s)} ${p(cx + r + 4 * s)},${p(cy + 10 * s)} ` +
    `Q${p(cx + r - 6 * s)},${p(cy - 14 * s)} ${p(cx + r - 18 * s)},${p(cy - 26 * s)} ` +
    `Q${p(cx + 30 * s)},${p(cy - 12 * s)} ${p(cx + 14 * s)},${p(cy - 30 * s)} ` +
    `Q${cx},${p(cy - 10 * s)} ${p(cx - 16 * s)},${p(cy - 30 * s)} ` +
    `Q${p(cx - 34 * s)},${p(cy - 10 * s)} ${p(cx - r + 14 * s)},${p(cy - 28 * s)} ` +
    `Q${p(cx - r + 2 * s)},${p(cy - 10 * s)} ${p(cx - r - 4 * s)},${p(cy + 10 * s)}Z"/>`;
}
function face(cx, cy, s, o = {}) {
  const r = 66 * s, e = 24 * s, ey = cy + 14 * s;
  let h = `<ellipse cx="${cx}" cy="${cy}" rx="${F(r)}" ry="${F(r * .93)}"/>`;
  h += o.bangs !== undefined ? o.bangs : bangs(cx, cy, s);
  for (const x of [cx - e, cx + e]) {
    h += `<ellipse class="k" cx="${F(x)}" cy="${F(ey)}" rx="${F(8.5 * s)}" ry="${F(11 * s)}"/>` +
      `<circle class="w" cx="${F(x + 3 * s)}" cy="${F(ey - 4 * s)}" r="${F(3.6 * s)}"/>` +

    const b = document.createElement('button');
    b.className = 'sw'; b.dataset.v = val; b.setAttribute('aria-label', name); b.innerHTML = inner;
    b.onclick = () => { color = val; markPalette(); pop(i); say(name); if (tool === 'eraser') setTool('fill'); };
    return b;
  }
  function markPalette() { document.querySelectorAll('.sw').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === color)); }

  function setTool(t) {
    tool = t;
    document.querySelectorAll('.tool').forEach(b => b.setAttribute('aria-pressed', b.dataset.tool === t));
    $('#sizes').hidden = t !== 'brush';
    paintG.setAttribute('pointer-events', t === 'eraser' ? 'visibleStroke' : 'none');
  }
  document.querySelectorAll('.tool').forEach(b => b.onclick = () => { setTool(b.dataset.tool); tone(t2f[b.dataset.tool]); say({ fill: '콕 칠하기', brush: '붓으로 그리기', eraser: '지우개' }[b.dataset.tool]); });
  const t2f = { fill: 660, brush: 740, eraser: 440 };
  document.querySelectorAll('.size').forEach(b => b.onclick = () => {
    size = +b.dataset.size; tone(500 + size * 10);
    document.querySelectorAll('.size').forEach(x => x.setAttribute('aria-pressed', x === b));
  });

  function sparkle(x, y, c) {
    const d = document.createElement('div'); d.className = 'fx'; d.style.left = x + 'px'; d.style.top = y + 'px';
    for (let k = 0; k < 8; k++) {
      const a = k / 8 * Math.PI * 2, r = 34 + Math.random() * 18, i = document.createElement('i');
      i.style.setProperty('--x', Math.cos(a) * r + 'px'); i.style.setProperty('--y', Math.sin(a) * r + 'px');
      i.style.setProperty('--c', c.startsWith('pt-') ? '#FFC83D' : (c === '#FFFFFF' ? '#E6D2E0' : c));
      d.appendChild(i);
    }
    document.body.appendChild(d); setTimeout(() => d.remove(), 600);
  }

  function setFill(i, v) {
    const el = artG.querySelector(`[data-i="${i}"]`); if (!el) return;
    if (v === '#FFFFFF') delete st.f[i]; else st.f[i] = v;
    el.setAttribute('fill', paintOf(v));
  }
  function svgPoint(e) {
    const pt = art.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    return pt.matrixTransform(art.getScreenCTM().inverse());
  }

  let drawing = null;
  art.addEventListener('pointerdown', e => {
    if (drawing || !e.isPrimary) return;
    e.preventDefault();
    if (tool === 'eraser' && e.target.parentNode === paintG) {
      const idx = [...paintG.children].indexOf(e.target);
      const rec = st.p[idx]; e.target.remove(); st.p.splice(idx, 1);
      undo.push({ t: 'rm', idx, rec }); tone(330); changed = true; persist(); return;
    }
    if (tool === 'fill' || tool === 'eraser') {
      const el = e.target.closest('[data-i]'); if (!el) return;
      const i = +el.dataset.i, v = tool === 'eraser' ? '#FFFFFF' : color, prev = st.f[i] || '#FFFFFF';
      if (prev === v) { tone(880, .08); return; }
      undo.push({ t: 'f', i, prev }); setFill(i, v);
      const ci = COLORS.findIndex(c => c[0] === v);
      tool === 'eraser' ? tone(330) : pop(ci < 0 ? 5 : ci);
      sparkle(e.clientX, e.clientY, v); changed = true; persist();
      return;
    }
    // 붓
    const p = svgPoint(e);
    drawing = { id: e.pointerId, pts: [[p.x, p.y]], rec: { c: color, w: size, d: '' } };
    drawing.el = strokeEl({ d: `M${p.x.toFixed(1)},${p.y.toFixed(1)} l0.1,0`, c: color, w: size });
    paintG.appendChild(drawing.el);
    try { art.setPointerCapture(e.pointerId); } catch (_) {}
  });
  art.addEventListener('pointermove', e => {
    if (!drawing || e.pointerId !== drawing.id) return;
    const p = svgPoint(e), l = drawing.pts[drawing.pts.length - 1];
    if (Math.hypot(p.x - l[0], p.y - l[1]) < 2.5) return;
    drawing.pts.push([p.x, p.y]);
    drawing.el.setAttribute('d', smooth(drawing.pts));
  });
  const endDraw = e => {
    if (!drawing || e.pointerId !== drawing.id) return;
    const d = drawing.pts.length > 1 ? smooth(drawing.pts) : drawing.el.getAttribute('d');
    drawing.rec.d = d; drawing.el.setAttribute('d', d);
    st.p.push(drawing.rec); undo.push({ t: 'p' }); drawing = null; changed = true; persist();
    tone(700, .1, 'sine', .08);
  };
  art.addEventListener('pointerup', endDraw);
  art.addEventListener('pointercancel', endDraw);
  function smooth(pts) {
    const f = n => n.toFixed(1);
    let d = `M${f(pts[0][0])},${f(pts[0][1])}`;
    for (let k = 1; k < pts.length - 1; k++) {
      const mx = (pts[k][0] + pts[k + 1][0]) / 2, my = (pts[k][1] + pts[k + 1][1]) / 2;
      d += ` Q${f(pts[k][0])},${f(pts[k][1])} ${f(mx)},${f(my)}`;
    }
    const z = pts[pts.length - 1]; return d + ` L${f(z[0])},${f(z[1])}`;
  }

  $('#undoBtn').onclick = () => {
    const u = undo.pop();
    if (!u) { tone(300, .1); return; }
    if (u.t === 'f') setFill(u.i, u.prev);
    else if (u.t === 'p') { st.p.pop(); paintG.lastChild && paintG.lastChild.remove(); }
    else if (u.t === 'rm') { st.p.splice(u.idx, 0, u.rec); paintG.insertBefore(strokeEl(u.rec), paintG.children[u.idx] || null); }
    else if (u.t === 'clr') {
      st.f = u.f; st.p = u.p;
      artG.querySelectorAll('[data-i]').forEach(el => el.setAttribute('fill', paintOf(st.f[el.dataset.i] || '#FFFFFF')));
      paintG.innerHTML = ''; st.p.forEach(s => paintG.appendChild(strokeEl(s)));
    }
    tone(520, .12); persist();
  };

  $('#clearBtn').onclick = () => {
    tone(440);
    modal(`<h3>모두 지울까요?</h3><div class="row"><button class="candy" id="mYes">네, 지울래요</button><button class="candy mint" id="mNo">아니요</button></div>`);
    $('#mYes').onclick = () => {
      undo.push({ t: 'clr', f: { ...st.f }, p: [...st.p] });
      st.f = {}; st.p = [];
      artG.querySelectorAll('[data-i]').forEach(el => el.setAttribute('fill', '#FFFFFF'));
      paintG.innerHTML = ''; changed = true; persist(); closeModal(); tone(330, .3);
    };
    $('#mNo').onclick = closeModal;
  };

  $('#backHome').onclick = () => { tone(520); goHome(); };
  function goHome() { persist(); renderHome(); show('home'); }

  // ───── 완성 ─────
  function toImage(w = 800) {
    const ser = new XMLSerializer(), h = w * 1.2;
    const wrap = inner => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="${w}" height="${h}"><defs>${DEFS}</defs>${inner}</svg>`);
    const load = src => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d');
    return load(wrap(ser.serializeToString(artG))).then(a => {
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(a, 0, 0, w, h);
      if (!paintG.children.length) return;
      return load(wrap(ser.serializeToString(paintG).replace(/ style="[^"]*"/, ''))).then(p => {
        ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(p, 0, 0, w, h); ctx.globalCompositeOperation = 'source-over';
      });
    }).then(() => cv.toDataURL('image/jpeg', .86));
  }

  const BIG_STAR = `<svg class="big-star" viewBox="0 0 40 40"><path d="M20,3 L25,14 L37,15 L28,23 L31,35 L20,29 L9,35 L12,23 L3,15 L15,14Z" fill="#FFC83D" stroke="#3A2447" stroke-width="2.4" stroke-linejoin="round"/><circle cx="16" cy="19" r="1.6" fill="#3A2447"/><circle cx="24" cy="19" r="1.6" fill="#3A2447"/><path d="M16.5,23 Q20,26 23.5,23" fill="none" stroke="#3A2447" stroke-width="1.6" stroke-linecap="round"/></svg>`;
  $('#doneBtn').onclick = async () => {
    tada(); confetti(); say('와! 정말 예뻐요! 별을 받았어요!');
    let img = '';
    try { img = await toImage(); } catch (e) {}
    const earned = changed || !S.done[cur.id];
    if (earned) { S.stars++; S.done[cur.id] = true; changed = false; }
    if (img) { S.gallery.unshift({ id: cur.id, img, t: Date.now() }); if (S.gallery.length > 30) S.gallery.length = 30; }
    persist();
    modal(`${BIG_STAR}<h3>${earned ? '별 하나 받았어요!' : '정말 예뻐요!'}</h3>` +
      (img ? `<img src="${img}" alt="${cur.name} 색칠 완성 그림"><p class="hint">내 그림에 넣어 두었어요</p>` : '') +
      `<div class="row"><button class="candy mint" id="mMore">계속 칠하기</button><button class="candy" id="mOther">다른 그림</button></div>`);
    $('#mMore').onclick = () => { tone(660); closeModal(); };
    $('#mOther').onclick = () => { tone(660); closeModal(); goHome(); };
  };

  // ───── 내 그림 ─────
  function renderGallery() {
    const g = $('#ggrid'); g.innerHTML = '';
    if (!S.gallery.length) { g.innerHTML = `<p class="empty">아직 그림이 없어요.<br>색칠하고 <b>다 했어요</b>를 누르면 여기 모여요!</p>`; return; }
    S.gallery.forEach((it, k) => {
      const b = document.createElement('button'); b.className = 'gitem';
      const p = PICTURES.find(x => x.id === it.id);
      b.setAttribute('aria-label', (p ? p.name : '그림') + ' 크게 보기');
      b.innerHTML = `<img src="${it.img}" alt="">`;
      b.onclick = () => viewItem(k);
      g.appendChild(b);
    });
  }
  function viewItem(k) {
    const it = S.gallery[k]; if (!it) return; tone(660);
    const p = PICTURES.find(x => x.id === it.id);
    modal(`<h3>${p ? p.name : '내 그림'}</h3><img src="${it.img}" alt="색칠한 그림"><p class="hint">그림을 꾹 누르면 사진첩에 저장할 수 있어요</p>` +
      `<div class="row"><button class="candy sky" id="mSave">저장하기</button><button class="candy mint" id="mClose">닫기</button><button class="candy plain" id="mDel">지우기</button></div>`);
    $('#mClose').onclick = closeModal;
    $('#mSave').onclick = () => saveImg(it.img);
    $('#mDel').onclick = () => {
      $('#sheet').querySelector('.row').innerHTML = `<button class="candy" id="mDel2">정말 지우기</button><button class="candy mint" id="mKeep">그냥 둘래요</button>`;
      $('#mKeep').onclick = closeModal;
      $('#mDel2').onclick = () => { S.gallery.splice(k, 1); persist(); closeModal(); renderGallery(); };
    };
  }
  async function saveImg(url) {
    try {
      const blob = await (await fetch(url)).blob();
      const file = new File([blob], '반짝색칠.jpg', { type: 'image/jpeg' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    try { const a = document.createElement('a'); a.href = url; a.download = '반짝색칠.jpg'; document.body.appendChild(a); a.click(); a.remove(); } catch (e) {}
    toast('안 되면 그림을 꾹 눌러서 저장해 주세요');
  }
  $('#toGallery').onclick = () => { tone(660); renderGallery(); show('gallery'); };
  $('#galBack').onclick = () => { tone(520); goHome(); };

  // ───── 팝업·효과 ─────
  function modal(html) { $('#sheet').innerHTML = html; $('#modal').hidden = false; }
  function closeModal() { $('#modal').hidden = true; }
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
  function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }

  function confetti() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const cv = $('#confetti'), ctx = cv.getContext('2d'), dpr = Math.min(2, devicePixelRatio || 1);
    cv.hidden = false; cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.scale(dpr, dpr);
    const cols = ['#FF5C9A', '#FFC83D', '#37C9AD', '#6FB8FF', '#A77BFF', '#FF8A4C'];
    const ps = Array.from({ length: 110 }, () => ({
      x: innerWidth / 2 + (Math.random() - .5) * 60, y: innerHeight * .45,
      vx: (Math.random() - .5) * 14, vy: -Math.random() * 15 - 5, r: Math.random() * 6 + 5,
      a: Math.random() * 6, va: (Math.random() - .5) * .4, c: cols[Math.random() * cols.length | 0], s: Math.random() < .4,
    }));
    const t0 = performance.now();
    (function frame(t) {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      ps.forEach(p => {
        p.vy += .38; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c;
        if (p.s) { ctx.beginPath(); for (let i = 0; i < 10; i++) { const q = i % 2 ? p.r * .45 : p.r, an = i * Math.PI / 5; ctx.lineTo(Math.cos(an) * q, Math.sin(an) * q); } ctx.fill(); }
        else ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2);
        ctx.restore();
      });
      if (t - t0 < 2600) requestAnimationFrame(frame); else { cv.hidden = true; ctx.setTransform(1, 0, 0, 1, 0, 0); }
    })(t0);
  }

  document.addEventListener('contextmenu', e => { if (!e.target.closest('.sheet img')) e.preventDefault(); });

  buildPalette(); setTool('fill'); renderHome(); show('home');
})();
</script>
<script>
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
</script>
</body>
